! Command: show running-config
! device: spine2 (vEOS-lab, EOS-4.32.0F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$SznwbnGjf0q5idRM$873CcqFDmDydu5oCq0UHAAFBdpmYTWJ4rv9tme0cw2jp7rxTVv0x5YNm5zH./K8MHYkcyZ8ZYjQOBOxqcxgYg1
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
logging buffered 12000 notifications
logging trap errors
logging console critical
logging host 1.1.1.2
logging host 1.1.1.3
logging facility local5
!
hostname spine2
!
snmp-server community vxlan ro ro
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
management api http-commands
   protocol unix-socket
   no shutdown
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
   description TO-LEAF1-ARISTA
   no switchport
   ip address 10.0.20.0/31
   ip ospf network point-to-point
   ip ospf mtu-ignore
   ip ospf area 0.0.0.0
!
interface Ethernet2
   description TO-LEAF2-ARISTA
   no switchport
   ip address 10.0.20.2/31
   ip ospf network point-to-point
   ip ospf mtu-ignore
   ip ospf area 0.0.0.0
!
interface Ethernet3
   description TO-LEAF3-CISCO
   no switchport
   ip address 10.0.20.4/31
   ip ospf network point-to-point
   ip ospf mtu-ignore
   ip ospf area 0.0.0.0
!
interface Ethernet4
   description TO-LEAF4-CISCO
   no switchport
   ip address 10.0.20.6/31
   ip ospf network point-to-point
   ip ospf mtu-ignore
   ip ospf area 0.0.0.0
!
interface Loopback0
   description BGP-Peering-RouterID
   ip address 10.0.255.102/32
   ip ospf area 0.0.0.0
!
interface Management1
   ip address 10.0.0.15/24
!
ip routing
!
ip route 0.0.0.0/0 10.0.0.2
!
ntp server 192.0.2.0 prefer
ntp server 192.0.2.1 prefer
!
router bgp 65000
   router-id 10.0.255.102
   no bgp default ipv4-unicast
   neighbor LEAF-PEERS peer group
   neighbor LEAF-PEERS remote-as 65001
   neighbor LEAF-PEERS update-source Loopback0
   neighbor LEAF-PEERS ebgp-multihop 3
   neighbor LEAF-PEERS send-community extended
   neighbor 10.0.250.11 peer group LEAF-PEERS
   neighbor 10.0.250.12 peer group LEAF-PEERS
   neighbor 10.0.250.13 peer group LEAF-PEERS
   neighbor 10.0.250.14 peer group LEAF-PEERS
   !
   address-family evpn
      neighbor LEAF-PEERS activate
      neighbor LEAF-PEERS next-hop-unchanged
!
router ospf 1
   router-id 10.0.255.102
   max-lsa 12000
!
end