! Command: show running-config
! device: leaf2 (vEOS-lab, EOS-4.32.0F)
!
! boot system flash:/vEOS-lab.swi
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$0ypyGBY1kG9zcVmE$0qXCRZGHBaXcT6RwxJ2.e01UlF3dZoo2KjUbbmaGmhliZ2E.58tuJEQokStCnKDMRgPOL6JQ1h3aHdCB/.o.v/
!
transceiver qsfp default-mode 4x10G
!
service routing protocols model multi-agent
!
logging buffered 12000 notifications
logging trap errors
logging console critical
logging host 1.1.1.2
logging host 1.1.1.3
logging facility local5
!
hostname leaf2
!
snmp-server community vxlan ro ro
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
vlan 40
   name Data_VLAN_40
!
vlan 50
   name Data_VLAN_50
!
vlan 60
   name Data_VLAN_60
!
vlan 101
   name L3VNI_Transit
!
vrf instance gold
!
management api http-commands
   protocol unix-socket
   no shutdown
!
management api gnmi
   transport grpc default
!
management api netconf
   transport ssh default
!
interface Ethernet1
!
interface Ethernet2
!
interface Ethernet3
!
interface Ethernet4
!
interface Ethernet5
!
interface Ethernet6
!
interface Ethernet7
   description host2-connection
   switchport access vlan 50
!
interface Ethernet8
!
interface Ethernet9
!
interface Ethernet10
!
interface Ethernet11
   description TO-SPINE1
   mtu 9214
   no switchport
   ip address 10.0.1.3/31
   ip ospf network point-to-point
   ip ospf mtu-ignore
   ip ospf area 0.0.0.0
   pim ipv4 sparse-mode
!
interface Ethernet12
   description TO-SPINE2
   mtu 9214
   no switchport
   ip address 10.0.20.3/31
   ip ospf network point-to-point
   ip ospf mtu-ignore
   ip ospf area 0.0.0.0
   pim ipv4 sparse-mode
!
interface Loopback0
   description BGP-Peering-RouterID
   ip address 10.0.250.12/32
   ip ospf area 0.0.0.0
!
interface Management1
   ip address 10.0.0.15/24
!
interface Vlan40
   description Anycast-Gateway
   mtu 9214
   vrf gold
   ip address 10.40.40.2/24
   ip virtual-router address 10.40.40.1
!
interface Vlan50
   description Anycast-Gateway
   mtu 9214
   vrf gold
   ip address 10.50.50.2/24
   ip virtual-router address 10.50.50.1
!
interface Vlan60
   description Anycast-Gateway
   mtu 9214
   vrf gold
   ip address 10.60.60.2/24
   ip virtual-router address 10.60.60.1
!
interface Vlan101
   description L3VNI-Transit
   mtu 9214
   vrf gold
!
interface Vxlan1
   vxlan source-interface Loopback0
   vxlan udp-port 4789
   vxlan flood vtep learned data-plane
   vxlan vlan 40 vni 100040
   vxlan vlan 50 vni 100050
   vxlan vlan 60 vni 100060
   vxlan vrf gold vni 100001
!
ip virtual-router mac-address 00:11:22:33:44:55
!
ip routing
ip routing vrf gold
!
ip route 0.0.0.0/0 10.0.0.2
!
ntp server 192.0.2.0 prefer
ntp server 192.0.2.1 prefer
!
router bgp 65001
   router-id 10.0.250.12
   no bgp default ipv4-unicast
   neighbor SPINES peer group
   neighbor SPINES remote-as 65000
   neighbor SPINES update-source Loopback0
   neighbor SPINES allowas-in 3
   neighbor SPINES ebgp-multihop 3
   neighbor SPINES send-community extended
   neighbor 10.0.255.101 peer group SPINES
   neighbor 10.0.255.102 peer group SPINES
   !
   vlan 40
      rd 10.0.250.12:40
      route-target import export 1:100040
   !
   vlan 50
      rd 10.0.250.12:50
      route-target import export 1:100050
      redistribute learned
   !
   vlan 60
      rd 10.0.250.12:60
      route-target import export 1:100060
   !
   address-family evpn
      neighbor SPINES activate
   !
   vrf gold
      rd 10.0.250.12:1
      route-target import evpn 1:100001
      route-target export evpn 1:100001
      redistribute connected
      !
      address-family ipv4
         redistribute connected
!
router ospf 1
   router-id 10.0.250.12
   max-lsa 12000
!
router pim sparse-mode
   ipv4
      rp address 10.0.255.254
!
end