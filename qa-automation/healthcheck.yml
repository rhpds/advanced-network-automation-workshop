---
# HEALTHCHECK — Quick environment readiness check
# Verifies the containerlab topology has no exited nodes, the Netbox
# web UI accepts the admin login, and AAP Controller, Gitea, and VS Code
# (code-server) are reachable with the workshop credentials. Read-only: reports problems but never
# remediates them (a containerlab redeploy would wipe student device
# configs). Recovery lives in setup-automation/setup-containerlab.sh.
# Should complete in under 60 seconds.
#
# Exit 0 = healthy, non-zero = unhealthy.

- name: Build inventory
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Add containerlab host
      ansible.builtin.add_host:
        name: containerlab
        ansible_ssh_host: containerlab
        ansible_ssh_port: "{{ lookup('ansible.builtin.env', 'BASTION_PORT') }}"
        ansible_ssh_user: "{{ lookup('ansible.builtin.env', 'BASTION_USER') }}"
        ansible_ssh_pass: "{{ lookup('ansible.builtin.env', 'BASTION_PASSWORD') }}"
        groups: clab

- name: Containerlab topology check
  hosts: clab
  gather_facts: false
  become: true
  vars:
    clab_topo: /home/lab-user/2_multi_vendor_vxlan/vxlan.base.clab.yml
  tasks:
    - name: Run containerlab inspect
      ansible.builtin.command:
        cmd: "containerlab inspect -t {{ clab_topo }} --format json"
      register: clab_inspect
      changed_when: false

    # Older containerlab returns {"containers": [...]}; newer versions
    # group nodes by lab name: {"<lab>": [...]}.
    - name: Parse container states
      vars:
        clab_data: "{{ clab_inspect.stdout | from_json }}"
        clab_nodes: >-
          {{ clab_data.containers if 'containers' in clab_data
             else clab_data.values() | list | flatten(levels=1) }}
      ansible.builtin.set_fact:
        exited_nodes: >-
          {{ clab_nodes
             | selectattr('state', 'equalto', 'exited')
             | map(attribute='name')
             | list }}

    - name: Assert no nodes are exited
      ansible.builtin.assert:
        that:
          - exited_nodes | length == 0
        fail_msg: "Exited containerlab nodes: {{ exited_nodes | join(', ') }}"
        success_msg: "All containerlab nodes are running"

- name: Netbox web UI login check
  hosts: clab
  gather_facts: false
  become: false
  vars:
    netbox_url: http://localhost:8282
    netbox_user: admin
    netbox_password: admin@123  # notsecret
  tasks:
    - name: Fetch Netbox login page
      ansible.builtin.uri:
        url: "{{ netbox_url }}/login/"
        return_content: true
        status_code: 200
        timeout: 10
      register: netbox_login_page

    - name: Extract CSRF token from login form
      ansible.builtin.set_fact:
        netbox_csrf_token: >-
          {{ netbox_login_page.content
             | regex_search('name="csrfmiddlewaretoken" value="([^"]+)"', '\1')
             | first }}

    - name: Submit Netbox login form
      ansible.builtin.uri:
        url: "{{ netbox_url }}/login/"
        method: POST
        body_format: form-urlencoded
        body:
          csrfmiddlewaretoken: "{{ netbox_csrf_token }}"
          username: "{{ netbox_user }}"
          password: "{{ netbox_password }}"
          next: /
        headers:
          Cookie: "{{ netbox_login_page.cookies_string }}"
          Referer: "{{ netbox_url }}/login/"
        follow_redirects: none
        status_code: [200, 302]
        timeout: 10
      register: netbox_login
      no_log: true

    # Success redirects (302) away from the login page; a bad password
    # re-renders the form with 200. Cookies aren't checked because uri
    # doesn't populate them when follow_redirects is none.
    - name: Assert Netbox login succeeded
      ansible.builtin.assert:
        that:
          - netbox_login.status == 302
          - "'/login' not in (netbox_login.location | default('/login'))"
        fail_msg: "Netbox web UI login failed for user {{ netbox_user }} (HTTP {{ netbox_login.status }})"
        success_msg: "Netbox web UI login succeeded for user {{ netbox_user }}"

# All service checks run from the containerlab VM, which resolves the
# other lab VMs (control, vscode) by short hostname.
- name: AAP Controller API login check
  hosts: clab
  gather_facts: false
  become: false
  vars:
    aap_url: https://control
    aap_user: admin
    aap_password: ansible123!  # notsecret
  tasks:
    # curl instead of uri: uri hangs against the AAP 2.6 gateway
    # (see lab-automation/playbooks/aap_bootstrap.yml).
    - name: Query Controller /me endpoint as admin
      ansible.builtin.command:
        argv:
          - curl
          - -sk
          - --max-time
          - "10"
          - -u
          - "{{ aap_user }}:{{ aap_password }}"
          - -w
          - "\n%{http_code}"
          - "{{ aap_url }}/api/controller/v2/me/"
      register: aap_me
      changed_when: false
      failed_when: false
      no_log: true

    - name: Assert AAP Controller login succeeded
      vars:
        aap_status: "{{ aap_me.stdout_lines | last | default('000') }}"
        aap_body: "{{ aap_me.stdout_lines[:-1] | join('') }}"
      ansible.builtin.assert:
        that:
          - aap_me.rc == 0
          - aap_status == "200"
          - (aap_body | from_json).results[0].username == aap_user
        fail_msg: "AAP Controller login failed for user {{ aap_user }} (curl rc={{ aap_me.rc }}, HTTP {{ aap_status }})"
        success_msg: "AAP Controller login succeeded for user {{ aap_user }}"

- name: Gitea API login check
  hosts: clab
  gather_facts: false
  become: false
  vars:
    gitea_url: http://localhost:8181
    gitea_user: gitea
    gitea_password: gitea123  # notsecret
  tasks:
    - name: Query Gitea authenticated user
      ansible.builtin.uri:
        url: "{{ gitea_url }}/api/v1/user"
        url_username: "{{ gitea_user }}"
        url_password: "{{ gitea_password }}"
        force_basic_auth: true
        return_content: true
        status_code: [200, 401]
        timeout: 10
      register: gitea_me
      no_log: true

    - name: Assert Gitea login succeeded
      ansible.builtin.assert:
        that:
          - gitea_me.status == 200
          - gitea_me.json.login == gitea_user
        fail_msg: "Gitea login failed for user {{ gitea_user }} (HTTP {{ gitea_me.status }})"
        success_msg: "Gitea login succeeded for user {{ gitea_user }}"

- name: VS Code (code-server) reachability check
  hosts: clab
  gather_facts: false
  become: false
  vars:
    vscode_url: http://vscode:8080
  tasks:
    # code-server runs with auth: none, so /healthz returning 200 is
    # sufficient to confirm the editor is serving.
    - name: Query code-server health endpoint
      ansible.builtin.uri:
        url: "{{ vscode_url }}/healthz"
        return_content: true
        status_code: 200
        timeout: 10
      register: vscode_health
      failed_when: false

    - name: Assert VS Code is reachable
      ansible.builtin.assert:
        that:
          - vscode_health.status | default(0) == 200
        fail_msg: >-
          VS Code (code-server) not reachable at {{ vscode_url }}
          (HTTP {{ vscode_health.status | default('n/a') }}: {{ vscode_health.msg | default('') }})
        success_msg: "VS Code (code-server) is reachable at {{ vscode_url }}"
